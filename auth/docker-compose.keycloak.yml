name: jev-auth

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: jev-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${JEV_KEYCLOAK_ADMIN_PASSWORD:?Run auth/setup-dev.py first}
      JEV_DEV_USER_PASSWORD: ${JEV_DEV_USER_PASSWORD:?Run auth/setup-dev.py first}
      JEV_AGENT_USER_PASSWORD: ${JEV_AGENT_USER_PASSWORD:?Run auth/setup-dev.py first}
      JEV_REVIEWER_USER_PASSWORD: ${JEV_REVIEWER_USER_PASSWORD:?Run auth/setup-dev.py first}
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HTTP_ENABLED: "true"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/jev-realm.json:/opt/keycloak/data/import/jev-realm.json:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  keycloak_data:
