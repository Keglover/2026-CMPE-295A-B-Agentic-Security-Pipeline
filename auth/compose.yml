name: promptrail-auth
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    ports:
      # Development identity service stays on the host loopback interface.
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: promptrail-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${PROMPTRAIL_KEYCLOAK_ADMIN_PASSWORD:?Run python auth/setup.py first}
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HTTP_ENABLED: "true"
    volumes:
      # Keep accounts and passwords across ordinary container restarts.
      - keycloak_data:/opt/keycloak/data
      - ./keycloak-realm.json:/opt/keycloak/data/import/promptrail-realm.json:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  keycloak_data:
