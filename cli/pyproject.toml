[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptrail-cli"
version = "0.1.0rc3"
description = "Promptrail terminal authentication client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12,<1",
  "pydantic>=2.12,<3",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
promptrail = "promptrail.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptrail*"]
