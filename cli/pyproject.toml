[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptrail-cli"
version = "0.1.0rc2"
description = "Standalone terminal client for authenticated security gateways"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12,<1",
  "rich>=13,<15",
  "pydantic>=2.12,<3",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
jev = "promptrail.main:app"
promptrail = "promptrail.promptrail:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptrail*", "jev*"]
